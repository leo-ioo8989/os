name: V3.09 Certification

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/core/src/v309-bounded-autonomy.ts'
      - 'packages/core/test/v309-bounded-autonomy.test.ts'
      - 'packages/core/src/v308-resource-governance.ts'
      - 'packages/core/src/index.ts'
      - 'package.json'
      - '.github/workflows/v309-certification.yml'

jobs:
  certify-v309:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: founder_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d founder_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Certify V3.09 and full regression
        run: pnpm verify:v309
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/founder_os
