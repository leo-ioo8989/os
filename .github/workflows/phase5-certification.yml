name: LEO OS Phase 5 Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core/src/v5*.ts'
      - 'packages/core/test/phase5-intelligent-company-os.test.ts'
      - 'packages/core/src/index.ts'
      - 'package.json'
      - '.github/workflows/phase5-certification.yml'
jobs:
  certify-phase5:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: founder_os
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d founder_os"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.0}
      - run: pnpm install --frozen-lockfile
      - name: Phase 5 full certification — V5.01 through V5.12 + prior phases
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/founder_os
        run: pnpm verify:phase5
