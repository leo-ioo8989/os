name: LEO OS V3.06 Certification
on:
  push:
    branches: [main, v306-workspace-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  certify-v306:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: founder_os
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d founder_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/founder_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: true
      - name: Certify V3.06
        run: pnpm verify:v306
