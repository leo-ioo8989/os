services:
  postgres:
    image: postgres:16-alpine
    container_name: leo-os-v107-postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: founder_os_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - leo_os_v107_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d founder_os_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  leo_os_v107_postgres_data:
